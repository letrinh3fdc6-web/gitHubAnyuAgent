name: Build AnyuAgent for macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            runtime_sha256: d8c88d3c8d08080651b692e3b4da8fa5bc7cc6c00ec877ca45dfb18ccab26e2e
          - arch: x64
            # macos-13 Intel runners are retired/indefinitely queued in the
            # current GitHub-hosted pool. macos-15 provides the x64 image.
            runner: macos-15
            runtime_sha256: 2ca6f1cfa205456349375ccdfa432c1e8bcdb63aa51ceddab7d4ea7d7fe33834
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore verified AnyuAgent macOS runtime
        env:
          RUNTIME_VERSION: v1.0.21
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          set -euo pipefail
          runtime_zip="${RUNNER_TEMP}/AnYuAgent-${RUNTIME_VERSION}-${{ matrix.arch }}.zip"
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RUNTIME_VERSION}/AnYuAgent-${RUNTIME_VERSION#v}-${{ matrix.arch }}.zip" \
            --output "${runtime_zip}"
          echo "${RUNTIME_SHA256}  ${runtime_zip}" | shasum --algorithm 256 --check
          runtime_root="${RUNNER_TEMP}/anyu-runtime"
          runtime_common="${RUNNER_TEMP}/anyu-runtime-common"
          mkdir -p "${runtime_common}"
          cp -R anyu-agent-desktop/pi-runtime/assets "${runtime_common}/assets"
          cp anyu-agent-desktop/pi-runtime/photon_rs_bg.wasm "${runtime_common}/photon_rs_bg.wasm"
          rm -rf "${runtime_root}" anyu-agent-desktop/pi-runtime
          mkdir -p "${runtime_root}" anyu-agent-desktop/pi-runtime
          unzip -q "${runtime_zip}" 'AnYuAgent.app/Contents/Resources/pi-runtime/*' -d "${runtime_root}"
          cp -R "${runtime_root}/AnYuAgent.app/Contents/Resources/pi-runtime/." anyu-agent-desktop/pi-runtime/
          cp -R "${runtime_common}/." anyu-agent-desktop/pi-runtime/
          chmod +x anyu-agent-desktop/pi-runtime/pi
          test -s anyu-agent-desktop/pi-runtime/pi
          file anyu-agent-desktop/pi-runtime/pi

      - name: Install desktop dependencies
        working-directory: anyu-agent-desktop
        run: npm ci --no-audit --no-fund

      - name: Build unsigned macOS package
        working-directory: anyu-agent-desktop
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyuAgent-macOS-${{ matrix.arch }}
          path: |
            anyu-agent-desktop/dist/*.dmg
            anyu-agent-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AnyuAgent-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.zip)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 macOS assets, found ${#assets[@]}"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          printf '%s\n' "${assets[@]}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnYuAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
