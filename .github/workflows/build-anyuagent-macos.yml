name: Build AnyuAgent for macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            # macos-13 Intel runners are retired/indefinitely queued in the
            # current GitHub-hosted pool. macos-15 provides the x64 image.
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Pi workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Pi macOS runtime
        run: |
          npm --prefix packages/tui run build:native:darwin
          npm --prefix packages/coding-agent run build:binary
          mkdir -p anyu-agent-desktop/pi-runtime
          cp packages/coding-agent/dist/pi anyu-agent-desktop/pi-runtime/pi
          chmod +x anyu-agent-desktop/pi-runtime/pi

      - name: Install desktop dependencies
        working-directory: anyu-agent-desktop
        run: npm ci --no-audit --no-fund

      - name: Build unsigned macOS package
        working-directory: anyu-agent-desktop
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyuAgent-macOS-${{ matrix.arch }}
          path: |
            anyu-agent-desktop/dist/*.dmg
            anyu-agent-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AnyuAgent-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.zip)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 macOS assets, found ${#assets[@]}"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          printf '%s\n' "${assets[@]}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnYuAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
