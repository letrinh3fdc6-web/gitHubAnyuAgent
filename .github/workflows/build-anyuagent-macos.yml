name: Build AnyuAgent for macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            macho_arch: arm64
          - arch: x64
            runner: macos-15-intel
            macho_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install AnyuAgent workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore pinned model catalog
        run: |
          set -euo pipefail
          ai_version="$(node -p "require('./packages/ai/package.json').version")"
          ai_archive="$(npm pack --silent --ignore-scripts --pack-destination "${RUNNER_TEMP}" "@earendil-works/pi-ai@${ai_version}")"
          catalog_root="${RUNNER_TEMP}/anyu-model-catalog"
          mkdir -p "${catalog_root}" packages/ai/src/providers/data
          tar -xzf "${RUNNER_TEMP}/${ai_archive}" -C "${catalog_root}" package/dist/providers/data
          cp -R "${catalog_root}/package/dist/providers/data/." packages/ai/src/providers/data/

      - name: Build native AnyuAgent runtime
        run: |
          set -euo pipefail
          npm --prefix packages/tui run build:native:darwin
          npm --prefix packages/tui run build
          npm --prefix packages/telemetry run build
          npm --prefix packages/ai run build:offline
          npm --prefix packages/agent run build
          npm --prefix packages/protocol run build
          npm --prefix packages/client run build
          npm --prefix packages/coding-agent run build
          bun build --compile --no-compile-autoload-bunfig \
            ./packages/coding-agent/src/bun/cli.ts \
            ./packages/coding-agent/src/utils/image-resize-worker.ts \
            --outfile packages/coding-agent/dist/pi
          npm --prefix packages/coding-agent run copy-binary-assets
          cp packages/coding-agent/dist/pi anyu-agent-desktop/pi-runtime/pi
          rm -f anyu-agent-desktop/pi-runtime/pi.exe
          chmod +x anyu-agent-desktop/pi-runtime/pi
          test -s anyu-agent-desktop/pi-runtime/pi

      - name: Install desktop dependencies
        working-directory: anyu-agent-desktop
        run: npm ci --no-audit --no-fund

      - name: Build unsigned macOS package
        working-directory: anyu-agent-desktop
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Verify packaged architectures
        env:
          EXPECTED_ARCH: ${{ matrix.macho_arch }}
        run: |
          set -euo pipefail
          app_binary="$(find anyu-agent-desktop/dist -type f -path '*/AnYuAgent.app/Contents/MacOS/AnYuAgent' -print -quit)"
          runtime_binary="$(find anyu-agent-desktop/dist -type f -path '*/AnYuAgent.app/Contents/Resources/pi-runtime/pi' -print -quit)"
          test -n "${app_binary}" && test -n "${runtime_binary}"
          file "${app_binary}" "${runtime_binary}" | tee "${RUNNER_TEMP}/anyu-architectures.txt"
          test "$(grep -c "${EXPECTED_ARCH}" "${RUNNER_TEMP}/anyu-architectures.txt")" -eq 2

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyuAgent-macOS-${{ matrix.arch }}
          path: |
            anyu-agent-desktop/dist/*.dmg
            anyu-agent-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AnyuAgent-macOS-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.zip)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected 4 macOS assets, found ${#assets[@]}"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          printf '%s\n' "${assets[@]}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnYuAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
