<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Anyu 图片与视频无限画布" />
        <link rel="icon" href="/anyu-canvas/logo.svg" />
        <title>Anyu 无限画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
      <script type="module" crossorigin src="/anyu-canvas/assets/index-CMo-wmWd.js"></script>
      <link rel="stylesheet" crossorigin href="/anyu-canvas/assets/index-BoKWLOvI.css">
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/anyu-canvas/config.js"></script>
    </body>
</html>
