name: AnyuAgent macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label, for example 1.0.59'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            build: dist:mac:arm64
          - arch: x64
            runner: macos-13
            build: dist:mac:x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set requested version
        if: github.event_name == 'workflow_dispatch'
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build renderer and macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node tools/build-vue-renderer.cjs
          npm run ${{ matrix.build }}

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp dist/*.dmg dist/*.zip artifact/ 2>/dev/null || true
          ls -lh artifact

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyuAgent-macOS-${{ matrix.arch }}
          path: artifact/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true
